<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=backspace" />
        <title> calculator</title>
    </head>
    <body>

        <section class="container col-19 col-xxxs-18 col-xxs-15 col-xs-12 col-sm-11 col-md-11 col-lg-10 col-xl-7">
            <audio id="clickSound" src="audio/soft-click-button.mp3" preload="auto"></audio>

            <div> 
                <input type="text" value="" id="output" data-result=""  readonly/>
            </div>

            <div>

                <button class="highlited" value="cos" > cos </button>
                <button class="highlited" value="sin" > sin </button>
                <button class="highlited" value="tan" > tan </button>
                <button class="highlited" id="clearButton" > C </button>
                <button class="highlited"  id="deletButton"> <i class="material-symbols-outlined "> backspace </i></button>
        
            </div>

            <div>
                 
                <button class="highlited" value="%"> % </button>
                <button class="highlited" value="(" > &#40; </button>
                <button class="highlited" value=")"> &#41; </button>
                <button class="highlited" value="exp"> exp </button>
                <button class="highlited" value="/"> / </button>
        
            </div>

            <div>
                
                <button class="highlited" value="&#8730;"> &#8730; </button>
                <button value="7"> 7 </button>
                <button value="8"> 8 </button>
                <button value="9"> 9 </button>
                <button class="highlited" value="*"> * </button>

            </div>

            <div>
                
                <button class="highlited" value="^"> ^ </button>
                <button value="4"> 4 </button>
                <button value="5"> 5 </button>
                <button value="6"> 6 </button>
                <button class="highlited" value="-"> - </button>
        
            </div>

            <div>
                
                <button class="highlited" value="&pi;"> &pi; </button>
                <button value="1"> 1 </button>
                <button value="2"> 2  </button>
                <button value="3"> 3 </button>
                <button class="highlited" value="+"> + </button>
        
            </div>

            <div>
                
                <button class="highlited" value="e"> e </button>
                <button value="0"> 0 </button>
                <button class="highlited" value="."> . </button>
                <button class="highlited" id="equal" > = </button>

            </div>

        </section>

        <script src="js/js.js"></script>
    </body>
</html>
